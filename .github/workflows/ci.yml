name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  unit:
    needs: build-and-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Unit tests
        run: go test -v -count=1 ./internal/manager/... ./internal/graphql/... ./internal/store/... ./internal/domain/...

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Integration tests
        run: go test -v -count=1 -timeout 120s -run 'TestOrchestrator' ./internal/orchestrator/
