name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  unit:
    needs: build-and-vet
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Unit tests
        run: go test -v -count=1 ./internal/manager/... ./internal/store/... ./internal/domain/...

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Integration tests
        run: go test -v -count=1 -timeout 120s -run 'TestOrchestrator' ./internal/orchestrator/
